{% extends "auth/Base_form.html" %}
{% block title %}Login Page{% endblock %}

{% block content %}

<style>
    .full-height {
        min-height: 100vh;
    }

    .login-box {
        width: 100%;
        max-width: 420px;
        padding: 30px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
</style>

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Placement Portal</span>
    <a href="{{url_for('home')}}" class="btn btn-outline-light btn-sm">Home</a>
</nav>

<div class="container-fluid full-height d-flex justify-content-center align-items-center">
    <div class="login-box">
        <h2 class="text-center mb-4">Login</h2>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
        </form>
    </div>
</div>

{% endblock %}
