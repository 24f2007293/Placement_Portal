{% extends "auth/Base_form.html" %}
{% block title %}Company Registration Page{% endblock %}
{% block content %}
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Placement Portal</span>
    <a href="{{url_for('home')}}" class="btn btn-outline-light btn-sm" style="text-align: right;">Home</a>
</nav>
<h2>Company Registration</h2>
<!--Navbar-->

<form class="row g-3" method="POST">
  <div class="col-md-6">
    <label for="company_name" class="form-label">Company Name</label>
    <input name="company_name"type="text" class="form-control" id="company_name" required>
  </div>
  <div class="col-md-6">
    <label for="inputEmail4" class="form-label">Email</label>
    <input type="email" class="form-control" name="email" id="inputEmail4" required>
  </div>
  <div class="col-12">
    <label for="inputPassword4" class="form-label">Password</label>
    <input name="password" type="password" class="form-control" id="inputPassword4" required>
  </div>
  <div class="col-12">
    <label for="hr_num" class="form-label">HR Contact</label>
    <input name="hr_num" type="text" class="form-control" id="hr_num">
  </div>
  <div class="col-mod-6">
    <label for="description" class="form-label">Company Description</label>
    <textarea name="description" class="form-control" id="description" placeholder="A Saas enterprise etc...." required></textarea>
  </div>
  <div class="col-md-6">
    <label for="basic-url" class="form-label">Company Website</label>
    <input name="website_url" type="text" class="form-control" id="basic-url" placeholder="www.company.com">
  </div>
  <div class="col-12"></div>
  <div>
    <button type="submit" class="btn btn-primary">Register</button>
  </div>
  <div>
    <small>
      Already have an account?
      <a href="{{url_for('login')}}">Login !</a>
    </small>
  </div>
</form>
{% endblock %}
