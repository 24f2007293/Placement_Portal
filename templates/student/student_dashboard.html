<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
<body>
    {%extends "auth/base_form.html"%}
    {%block content%}
              <nav class="navbar navbar-dark bg-dark px-3">
                    <div class="d-flex align-items-center justify-content-between w-100 text-white">
                            <span style="text-align: right;">
                                Welcome {{ current_user.student_profiles.first_name }} !
                            </span>
                            <span class="d-flex" style="text-align: left;">
                                <form method="GET" action="{{url_for('admin_comp')}}" >
                                    <div class="input-group align-items-center" >
                                        <input class="py-0 " style="width: 150px; border-color: black;" type="text" name="q" placeholder="Search Company" >
                                        <div class="input-group-text p-0 me-4 bg-dark" style="border: none;">
                                            <button type="submit" class="input-group-text p-0 me-1 bg-dark" style="border: none;">
                                                🔍
                                            </button>
                                        </div>
                                    </div>
                                </form>
                                <a href="{{url_for('edit_sprofile')}}" class="btn btn-outline-light btn-sm">Edit Profile</a>
                                <a href="{{url_for('logout')}}" class="btn btn-danger btn-sm">Logout</a>
                            </span>
                    </div>
                </nav>
    <h1>Student Dashboard</h1>
    <p>Welcome, {{ current_user.student_profiles.first_name }}!</p>
    {%endblock%}
</body>
</html>
